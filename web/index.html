<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pocket God</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font: 16px/1.4 system-ui, sans-serif;
    }

    /* Bevy (fit_canvas_to_parent) sizes the canvas to the page and letterboxes the
       landscape game inside it. */
    #pocket-god {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      background: #000;
      pointer-events: none;
    }

    #rotate-hint {
      display: none;
    }

    /* Landscape only, like the original: ask phones held upright to turn. */
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-hint {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <canvas id="pocket-god"></canvas>
  <div id="loading" class="overlay">Loading…</div>
  <div id="rotate-hint" class="overlay">Turn your device sideways to play.</div>

  <script>
    // Browsers keep an AudioContext that was created before any user input suspended. Bevy's
    // audio (cpal's WebAudio backend) creates its context at startup, so track every
    // context and resume them on input. This must run before the wasm module loads.
    //
    // A hidden page falls silent at once, like the suspended iOS app: the game also pauses
    // its voices, but Bevy hardly updates in a hidden tab, so the contexts are suspended here
    // and resumed when the page shows again.
    (() => {
      const NativeAudioContext = window.AudioContext;
      if (!NativeAudioContext) {
        return;
      }

      const contexts = [];
      window.AudioContext = new Proxy(NativeAudioContext, {
        construct(target, args) {
          const context = new target(...args);
          contexts.push(context);
          return context;
        },
      });

      let pageHidden = false;

      // Without user input the browser may refuse to resume; the next input resumes then.
      const ignoreRefusal = () => {};

      const resumeAudio = () => {
        if (pageHidden) {
          return;
        }
        for (const context of contexts) {
          if (context.state !== "running") {
            context.resume().catch(ignoreRefusal);
          }
        }
      };

      const suspendAudio = () => {
        for (const context of contexts) {
          if (context.state === "running") {
            context.suspend().catch(ignoreRefusal);
          }
        }
      };

      const inputEvents = ["pointerdown", "pointerup", "touchend", "keydown", "click"];
      for (const name of inputEvents) {
        window.addEventListener(name, resumeAudio, { capture: true });
      }

      const hidePage = () => {
        pageHidden = true;
        suspendAudio();
      };

      const showPage = () => {
        pageHidden = false;
        resumeAudio();
      };

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          hidePage();
        } else {
          showPage();
        }
      });
      window.addEventListener("pagehide", hidePage);
      window.addEventListener("pageshow", () => {
        if (!document.hidden) {
          showPage();
        }
      });
    })();

    // Phones: on the first touch, go full screen and lock to landscape where the browser
    // allows it. Elsewhere (e.g. iPhone Safari) the rotate hint covers portrait.
    const lockLandscape = async (event) => {
      if (event.pointerType !== "touch" || !document.documentElement.requestFullscreen) {
        return;
      }

      try {
        await document.documentElement.requestFullscreen();
        await screen.orientation.lock("landscape");
      } catch {
        // Not allowed here; the game still runs letterboxed.
      }
    };
    window.addEventListener("pointerup", lockLandscape, { capture: true, once: true });
  </script>

  <script type="module">
    // Generated by scripts/build-web.sh (wasm-bindgen --target web).
    import init from "./pkg/pocket_god.js";

    const loading = document.getElementById("loading");
    try {
      await init();
      loading.remove();
    } catch (error) {
      loading.textContent = `Pocket God failed to start: ${error}`;
      throw error;
    }
  </script>
</body>
</html>
