name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  ANDROID_ABIS: arm64-v8a x86_64
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Android APK (ARM64 and x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358
          log-accepted-android-sdk-licenses: false

      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Rust toolchain and Android targets
        run: |
          rustup set profile minimal
          rustup show active-toolchain
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-ndk-28.2.13676358
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Configure release signing
        id: signing
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PROPERTIES" ]]; then
            echo 'Signing secrets are unavailable; building a debug APK.'
            exit 0
          fi

          umask 077
          signing_dir="$RUNNER_TEMP/android-signing"
          mkdir -p "$signing_dir"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.keystore"
          printf '%s\n' "$ANDROID_KEYSTORE_PROPERTIES" > "$signing_dir/key.properties"
          printf 'keyProperties=%s\nstoreFile=%s\n' \
            "$signing_dir/key.properties" \
            "$signing_dir/release.keystore" > android/keystore.properties

          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Build APK
        id: apk
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          if [[ "$SIGNING_ENABLED" == 'true' ]]; then
            scripts/build-android.sh --release
            variant=release
          else
            scripts/build-android.sh
            variant=debug
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            "android/app/build/outputs/apk/$variant/app-$variant.apk"

          mkdir -p dist
          cp "android/app/build/outputs/apk/$variant/app-$variant.apk" \
            "dist/pocket-god-android-$variant.apk"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"

      - name: Remove release signing files
        if: always()
        run: |
          rm -f android/keystore.properties
          rm -rf "$RUNNER_TEMP/android-signing"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocket-god-android-${{ steps.apk.outputs.variant }}
          path: dist/pocket-god-android-${{ steps.apk.outputs.variant }}.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
