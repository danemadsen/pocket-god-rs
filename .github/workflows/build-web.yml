name: Build web and deploy Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: web-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain and web target
        run: |
          rustup set profile minimal
          rustc --version
          rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies and tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: web
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          locked_version=$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          lockfile = tomllib.loads(Path("Cargo.lock").read_text())
          package = next(package for package in lockfile["package"] if package["name"] == "wasm-bindgen")
          print(package["version"])
          PY
          )
          installed_version=$(wasm-bindgen --version 2>/dev/null || true)
          if [[ "$installed_version" != "wasm-bindgen $locked_version" ]]; then
            cargo install --locked wasm-bindgen-cli --version "$locked_version"
          fi

      - name: Build web
        run: scripts/build-web.sh

      - name: Upload downloadable web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocket-god-web
          path: web/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
